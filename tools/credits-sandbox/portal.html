<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>SCUPH · Sandbox credits</title><style>body{margin:3rem auto;padding:0 1rem;max-width:42rem;background:#182b31;color:#f1ecdd;font:17px system-ui}button{padding:.7rem;background:#efce8a;border:0;border-radius:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<main><small>SCUPH SAFARI / OPERATOR PILOT</small><h1>Credits &amp; prizes</h1>
<p>Sandbox receipts and Sepolia test prizes only. Signing links this wallet to a test account. It does not move assets.</p>
<button id="link">Link self-custody wallet</button> <button id="refresh" disabled>Refresh ledger</button>
<pre id="out" aria-live="polite"></pre></main>
<script type="module">
let token
const link=document.querySelector('#link'),refresh=document.querySelector('#refresh'),out=document.querySelector('#out')
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
function reset(){token=null;refresh.disabled=true;out.textContent=''}
async function show(){const v=await api('/ledger',{});out.textContent=[v.wallet,`${v.credits} test credits`,'',...v.entries.map(e=>`${e.booked} UTC · ${e.ticket}: ${e.delta>0?'+':''}${e.delta}`),'','Prizes',...v.prizes.map(p=>`${p.award} · ${p.kind} ${p.units} ${p.asset} · ${p.tx||'awaiting delivery'}`)].join('\n')}
link.onclick=async()=>{try{reset();const w=window.ethereum;if(!w)throw Error('Open in a browser with an EVM wallet extension.');const [wallet]=await w.request({method:'eth_requestAccounts'});if(await w.request({method:'eth_chainId'})!=='0xaa36a7')throw Error('Select Sepolia in your wallet and reconnect.');const c=await api('/challenge',{wallet});const hex='0x'+Array.from(new TextEncoder().encode(c.message),b=>b.toString(16).padStart(2,'0')).join('');const signature=await w.request({method:'personal_sign',params:[hex,wallet]});token=(await api('/verify',{nonce:c.nonce,signature})).token;refresh.disabled=false;await show()}catch(e){out.textContent=e.message}}
refresh.onclick=()=>show().catch(e=>out.textContent=e.message)
window.ethereum?.on?.('accountsChanged',reset);window.ethereum?.on?.('chainChanged',reset)
</script></html>
